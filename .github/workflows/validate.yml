name: Validate foundation
on:
  pull_request:
  push:
    branches: [increment-1-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-forge-ui-acceptance-screenshots
          path: |
            visual-screenshots
            playwright-report
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-build
          path: |
            dist
            package-lock.json
